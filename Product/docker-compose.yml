version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - USE_MOCK_API=true
      - BURGERPRINTS_API_KEY=${BURGERPRINTS_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:///../ai/data/sqlite.db
    volumes:
      - ./ai/data:/app/ai/data
